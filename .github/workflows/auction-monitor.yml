name: Auction Watch — refresh lots

on:
  workflow_dispatch:   # run manually from the Actions UI first, and check
                        # the "Fetch lots" step's log for per-platform notes
    inputs:
      debug_html:
        description: "Upload each fetched page's raw HTML as a build artifact (for writing/fixing a platform parser against real markup)"
        required: false
        default: false
        type: boolean
      probe_url:
        description: "One-off: render this single URL with Playwright and push it to debug/auction-html as debug_html/probe.html, without touching the main fetch/valuation pipeline (e.g. checking whether a lot-detail page has a VIN)"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 13 * * *"   # daily, 13:00 UTC (~6-7am Boise, before most auctions close)

permissions:
  contents: write
  actions: write   # needed to dispatch the Hugo deploy workflow

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml playwright

      - name: Install Playwright's Chromium
        # Needed for scripts/musick_render.py: bid.musickauction.com's
        # per-item lot pages are a JS-rendered app (confirmed - a plain
        # GET there returns HTTP 202 with an empty body), so getting real
        # bid data means loading them in an actual browser, not just
        # fetching the URL. --with-deps also installs the OS libraries
        # Chromium needs that a bare ubuntu-latest runner won't have.
        run: playwright install --with-deps chromium

      - name: Fetch lots
        if: github.event.inputs.probe_url == ''
        run: |
          if [ "${{ github.event.inputs.debug_html }}" = "true" ]; then
            python scripts/auction_finder.py --save-html debug_html
          else
            python scripts/auction_finder.py
          fi

      - name: Render probe_url (debug)
        # Standalone one-off, deliberately outside auction_finder.py's
        # pipeline: just load a single URL (e.g. a lot-DETAIL page, which
        # the main fetch never visits - it only renders each auction's
        # catalog LISTING page) and save whatever comes back, to answer a
        # one-off "does this page even have X" question without writing a
        # real parser for it first.
        if: github.event.inputs.probe_url != ''
        env:
          # Passed as an env var rather than interpolated into the script
          # text directly - the input is free-form text from whoever
          # triggers the workflow, and substituting it straight into a
          # shell/python literal is a known script-injection footgun.
          PROBE_URL: ${{ github.event.inputs.probe_url }}
        run: |
          mkdir -p debug_html
          python -c "
          import os, sys
          sys.path.insert(0, 'scripts')
          from musick_render import render_catalog_page
          url = os.environ['PROBE_URL']
          html, api_calls = render_catalog_page(url)
          print(f'probe_url: {len(html) if html else 0} bytes, {len(api_calls)} XHR/fetch call(s)')
          for c in api_calls:
              print(f'  {c[\"method\"]} {c[\"url\"]}')
          with open('debug_html/probe.html', 'w', encoding='utf-8') as f:
              f.write(html or '')
          "

      - name: Upload raw HTML (debug)
        if: github.event.inputs.debug_html == 'true' || github.event.inputs.probe_url != ''
        uses: actions/upload-artifact@v4
        with:
          name: auction-debug-html
          path: debug_html/
          retention-days: 3

      - name: Push raw HTML to debug branch
        # Belt-and-suspenders alongside the artifact upload above: the
        # artifact download URL points at Azure blob storage, which isn't
        # reachable from the dev sandbox this repo's tooling gets built in
        # (same network policy that blocks the 5 auction sites + ebay.com
        # directly) - but plain `git` to github.com clearly *is* reachable,
        # so pushing the dump to its own branch is the actual way to get
        # real markup back into that session for writing parsers.
        if: github.event.inputs.debug_html == 'true' || github.event.inputs.probe_url != ''
        run: |
          if [ -d debug_html ] && [ -n "$(ls -A debug_html 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B debug/auction-html
            git add -f debug_html/
            git commit -m "debug: raw HTML dump from auction sites + eBay [skip ci]"
            git push -f origin debug/auction-html
            git checkout main
          else
            echo "no debug_html files to push"
          fi

      - name: Harvest closed-lot prices
        # Phase 1 of PRICE-DISCOVERY.md - "own the close price". Runs after
        # "Fetch lots" (so it has a fresh catalog list to work from) and
        # before "Estimate value" (so a valuation bug can never skip an
        # append-only harvest). continue-on-error: true because a harvest
        # failure must never block the day's lots refresh - see
        # scripts/price_history.py's module docstring for the honesty rule
        # this enforces.
        if: github.event.inputs.probe_url == ''
        continue-on-error: true
        run: python scripts/price_history.py

      - name: Estimate value (needs ANTHROPIC_API_KEY secret)
        if: github.event.inputs.probe_url == ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/auction_value.py

      - name: Run tests before committing to main
        # This bot commits straight to main, bypassing PR review, so this is
        # the only gate. Includes the data/-format guard: a file Hugo can't
        # parse under data/ breaks every deploy (it happened once - the
        # first harvest's .jsonl, deploy run #329). A failure here stops the
        # job, so the commit below never runs.
        if: github.event.inputs.probe_url == ''
        run: python -m unittest discover scripts/tests

      - name: Commit updated lots
        if: github.event.inputs.probe_url == ''
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/auction_lots.yaml
          shopt -s nullglob
          cache_files=(data/.cache/auction_*.json)
          if [ ${#cache_files[@]} -gt 0 ]; then
            git add "${cache_files[@]}"
          fi
          price_history_files=(research/price_history/*)
          if [ ${#price_history_files[@]} -gt 0 ]; then
            git add "${price_history_files[@]}"
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: refresh auction lots [skip ci]"
            git push origin main
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Hugo deploy
        if: steps.commit.outputs.committed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            })
