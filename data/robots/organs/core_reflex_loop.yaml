id: core_reflex_loop
name: Reflex Loop (10 Hz main loop)
region: core
group: sensing

description: |
  The heartbeat of the robot. Runs at 10 Hz and evaluates every tick:
  is anything wrong? Is there an intent waiting? Do the safety flags permit acting?
  TRIGGER on every powered-on tick — this organ never sleeps while the robot is active.
  It drains the intent queue, fires owned_by:goddard skills (movement, power, sensing),
  polls the safety monitor before any action is dispatched, and supervises every
  sub-loop registered in the skill registry (see SCHEMA.md § Sub-loops). On each
  tick it reads a sub_loop_report from every registered sub-loop and checks the
  healthy flag; any criticality:safety sub-loop with healthy:false is raised to
  core_safety_monitor as a precondition failure for its dependent skills.
  Elderly-care context: if a resident calls out or a fall-detection event arrives,
  the reflex loop is the first system to receive it — no planner latency, no queue wait.
  Modular note: sub_loop_reports is optional — a stationary configuration with no
  legs registers no balance sub-loop and core tolerates an empty map. Presence of
  a sub-loop is discovered at boot, not assumed.
  SKIP for planner-mediated (owned_by:jarvis) skills — those enter the intent queue
  and are dispatched by the sequence_reading layer, not here.

hardware:
  slot: chassis-embedded-core
  power_w: 3
  deploy_time_ms: 0             # always running; zero deploy cost
  consumables: []
  envelope_cm: [0, 0, 0]        # firmware — no physical envelope

preconditions:
  - system_powered: true
  - sbc_boot_complete: true

inputs:
  intent_queue: {type: queue, required: false}   # drained each tick if non-empty
  safety_flags: {type: map, required: true}       # live flag map from safety monitor
  sub_loop_reports: {type: map, required: false}  # sub_loop id -> sub_loop_report;
                                                  # empty map is valid (legless/stationary configs)

outputs:
  tick_count: number             # cumulative ticks since boot
  active_skill_id: string        # id of the skill fired this tick, or null
  queue_depth: number            # intents remaining after this tick's drain
  safety_flag_snapshot: map      # state of all flags at tick time

composes_with:
  - core_safety_monitor          # evaluated before every skill dispatch
  - core_power_bus               # checks power state each tick
  - core_battery                 # reads battery_pct for precondition eval

safety:
  - voice_interruptible: true    # any spoken command from resident pre-empts current intent
  - every sub-loop in sub_loop_reports is checked each tick; criticality:safety
    sub-loops with healthy:false block their dependent skills until recovery
  - safety monitor evaluation is non-override-able; reflex loop cannot bypass it

owned_by: goddard
canonical_example: goddard      # autonomic layer — namesake archetype
