<style>
/* ===========================
   SHARED AUCTION-WATCH / GRANDPA'S-SHOP STYLES
   =========================== */
.auctions-page { max-width: 1080px; margin: 0 auto; padding: 0 24px 100px; }

.auctions-hero { text-align: center; padding: 48px 16px 8px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 40px; }
.auctions-hero h1 {
  font-family: 'Impact', 'Haettenschweiler', 'Arial Narrow Bold', sans-serif;
  font-size: clamp(56px, 12vw, 120px); line-height: 0.9; margin: 0 0 12px;
  color: var(--pink); text-transform: uppercase; letter-spacing: 0.02em;
  text-shadow: 4px 4px 0 var(--black), 8px 8px 0 var(--gold);
}
.auctions-hero p { max-width: 560px; margin: 0 auto; color: var(--white-dim); line-height: 1.6; }

.auctions-page h2 {
  font-family: 'Impact', 'Arial Narrow Bold', sans-serif; text-transform: uppercase;
  font-size: 28px; letter-spacing: 0.03em; color: var(--gold);
  border-bottom: 2px solid var(--pink); padding-bottom: 6px; margin: 56px 0 20px;
}
.auctions-page .prose { color: var(--white-dim); line-height: 1.65; }
.auctions-page .prose a { color: var(--pink); }
.auctions-assump { font-size: 12px; color: var(--white-faint); font-style: italic; margin: 8px 0 20px; }

/* summary strip */
.auctions-summary { display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0 28px; }
.auctions-stat { border: 2px outset rgba(255,255,255,0.15); background: rgba(255,255,255,0.03); padding: 10px 18px; text-align: center; min-width: 120px; }
.auctions-stat .n { display: block; font-family: 'Impact', sans-serif; font-size: 26px; color: var(--gold); }
.auctions-stat .l { display: block; font-size: 10px; color: var(--white-faint); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }

/* table */
.auctions-table-wrap { overflow-x: auto; margin: 20px 0; border: 2px outset rgba(255,255,255,0.15); }
table.auctions-tbl { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 760px; }
table.auctions-tbl th, table.auctions-tbl td { padding: 8px 12px; text-align: right; border-bottom: 1px solid rgba(255,255,255,0.08); white-space: nowrap; }
table.auctions-tbl th { background: var(--black); color: var(--gold); text-transform: uppercase; font-size: 11px; letter-spacing: 0.08em; position: sticky; top: 0; }
table.auctions-tbl td:first-child, table.auctions-tbl th:first-child { text-align: left; white-space: normal; min-width: 220px; }
table.auctions-tbl tr:hover td { background: rgba(255,45,138,0.08); }
table.auctions-tbl tr.row-flagged td { background: rgba(109,211,109,0.08); }
/* "last-minute snag" urgency, set live by auction-dial-in.html's countdown
   script from each row's data-ends-at - never baked in at build time,
   since the data can be up to ~24h stale between cron refreshes. */
table.auctions-tbl tr.closing-soon td.auctions-closes { color: #ffb84d; font-weight: 700; }
table.auctions-tbl tr.closing-urgent td.auctions-closes { color: #ff6b6b; font-weight: 700; }
table.auctions-tbl tr.closing-urgent td.auctions-closes::before { content: "⏰ "; }
table.auctions-tbl tr.row-closed td { opacity: 0.45; }
table.auctions-tbl tr.row-closed td.auctions-closes { font-style: italic; }

.deal-badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 2px; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
.deal-badge.flag { background: #1c7a3c; color: #eafff0; }
.auctions-gap-pos { color: #6dd36d; font-weight: 700; }
.auctions-gap-neg { color: var(--white-faint); }
.auctions-note { display: block; font-size: 11px; color: var(--white-faint); margin-top: 3px; white-space: normal; max-width: 260px; text-align: left; }
/* Real vehicle spec chips (mileage/title/VIN/candidate) from each lot's

.auctions-vehicle-specs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; max-width: 320px; }
.spec-chip { display: inline-block; font-size: 10px; padding: 2px 6px; border: 1px solid rgba(255,255,255,0.15); color: var(--white-dim); white-space: nowrap; text-transform: none; letter-spacing: normal; }

.spec-chip-warn { color: #ff6b6b; border-color: rgba(255,107,107,0.4); }

.auctions-watch-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; max-width: 320px; }
.watch-chip { display: inline-block; font-size: 10px; padding: 2px 6px; border: 1px solid var(--pink); color: var(--pink); white-space: nowrap; text-transform: none; letter-spacing: normal; }
.auctions-src { font-size: 10px; padding: 1px 6px; border: 1px solid var(--white-faint); color: var(--white-faint); text-transform: uppercase; }
.value-src { display: block; font-size: 10px; margin-top: 2px; cursor: help; }
.value-src-ebay { color: #6dd36d; }
.value-src-ai { color: var(--white-faint); font-style: italic; }
.auctions-empty { color: var(--white-faint); font-style: italic; padding: 24px 0; text-align: center; }
.auctions-cat-head { color: var(--pink); font-size: 16px; text-transform: uppercase; letter-spacing: 0.05em; margin: 28px 0 4px; border: none; padding: 0; }
.auctions-cat-n { color: var(--white-faint); font-size: 12px; text-transform: none; letter-spacing: normal; }

/* dial-in controls */
.auctions-dialin { border: 2px outset rgba(255,255,255,0.15); background: rgba(255,255,255,0.03); padding: 16px 20px; margin: 8px 0 28px; }
.dialin-row { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
.dialin-row + .dialin-row { margin-top: 12px; }
.auctions-dialin label { color: var(--white-dim); font-size: 13px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.auctions-dialin label strong { color: var(--gold); }
.dialin-hint { color: var(--white-faint); font-size: 11px; }
.auctions-dialin input[type="range"] { flex: 1 1 200px; min-width: 160px; accent-color: var(--pink); }
.dialin-actions { justify-content: space-between; }
.dialin-count { color: var(--white-dim); font-size: 13px; }
.dialin-count strong { color: var(--pink); font-family: 'Impact', sans-serif; font-size: 16px; }
.dialin-email-btn { border: 2px outset rgba(255,255,255,0.2); background: transparent; padding: 8px 16px; color: var(--gold); font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; font-family: inherit; }
.dialin-email-btn:hover { background: var(--pink); color: var(--black); border-color: var(--pink); }
.dialin-note { font-size: 11px; color: var(--white-faint); font-style: italic; margin: 10px 0 0; }
.dialin-note code { color: var(--white-dim); }
</style>
