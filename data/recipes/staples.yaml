# Almond Farm — Staple Recipe Registry
#
# These are the known-good, repeatable meals in regular rotation.
# They anchor the meal planner: when you pick 1-2 "intense" anchor dishes
# for the week, the planner fills remaining days from this list,
# prioritizing ingredient overlap to minimize waste.
#
# Season tags: spring | summer | fall | winter | all
# Type: main | side | salad | sauce
# Protein: chicken | pork | beef | seafood | vegetarian | none

