{{ define "main" }}
<div class="page-wrap">
  {{ if .CurrentSection }}
    <a class="back-link" href="{{ .CurrentSection.RelPermalink }}">&larr; Back to {{ .CurrentSection.Title }}</a>
  {{ end }}
  <article class="single-post">
    <h1>{{ .Title }}</h1>
    <div class="post-meta">
      <time>{{ .Date.Format "January 2, 2006" }}</time>
      {{ with .Params.author }} &middot; {{ . }}{{ end }}
    </div>
    <div class="content">
      {{ .Content }}
    </div>
  </article>
</div>
{{ end }}
