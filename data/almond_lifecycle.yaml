# Almond Farm — Annual Lifecycle Events
# These appear on the calendar under the "Almond Farm" toggle.
#
# UPDATE EACH YEAR: Change the year in all dates. Adjust ±2 weeks based on
# actual chilling hours received and your variety mix (Nonpareil blooms first,
# then Carmel/Padre/Mission follow ~3-5 days later).
#
# Reference timing for California Central Valley:
#   Bloom:            mid-Feb – early Mar
#   Harvest start:    late Jul (early) / Aug 1 (Nonpareil) / Sep (Mission)
#   Pruning window:   Dec 15 – Feb 14
#   Hull split:       Jul 15 – Aug 10 (varies by variety & heat)

