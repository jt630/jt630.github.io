name: Dinger Palooza — Team Config Audit

on:
  # Run manually from GitHub Actions UI whenever you want to check
  workflow_dispatch:

  # Run twice a week:
  # Sunday at 13:30 UTC — 30 min after the draft board updates (9 AM ET draft day)
  # Monday at 12:00 UTC — morning sanity check
  schedule:
    - cron: "30 13 * * 0"  # Sundays at 13:30 UTC (9:30 AM ET)
    - cron: "0 12 * * 1"   # Mondays at 12:00 UTC (8 AM ET)

permissions:
  contents: write   # needed to push auto-fix commits

jobs:
  audit-teams:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/dinger_palooza/requirements.txt

      - name: Run team config audit
        # exit code 1 if any STALE/NOTFOUND players — marks the job as failed
        # so you see a red X on the Actions tab without digging into logs
        run: |
          cd scripts/dinger_palooza
          python check_teams.py --gha --fix
        continue-on-error: true
        id: audit

      - name: Commit auto-fixed team assignments
        if: steps.audit.outcome == 'failure'
        run: |
          if git diff --quiet scripts/dinger_palooza/config.py; then
            echo "No config.py changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add scripts/dinger_palooza/config.py
            git commit -m "fix(dinger-palooza): auto-update stale team assignments in config.py"
            git push
            echo "Pushed config.py update."
          fi

      - name: Fail job if issues found
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::error::Stale or missing player-team entries detected. Check the job summary and update config.py."
          exit 1
