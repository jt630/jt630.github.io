{{ with .Site.Data.contributors }}
<div class="contributors">
  {{ range . }}
  <div class="contributor-card">
    {{ with .photo }}
      <img src="{{ . }}" alt="{{ $.name }}">
    {{ else }}
      <div style="width:100px;height:100px;border-radius:50%;background:var(--yellow);margin:0 auto 1rem;display:flex;align-items:center;justify-content:center;font-size:2.5rem;font-family:'Baloo 2',cursive;color:var(--dark);">{{ substr .name 0 1 }}</div>
    {{ end }}
    <h3>{{ .name }}</h3>
    {{ with .role }}<div class="role">{{ . }}</div>{{ end }}
    {{ with .bio }}<p>{{ . }}</p>{{ end }}
  </div>
  {{ end }}
</div>
{{ end }}
