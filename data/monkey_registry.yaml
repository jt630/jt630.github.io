# Monkey Registry
#
# Each entry is one monkey — a real baby name that held the #1 position
# in a given country/language for a given year.
#
# UNIQUE KEY FORMAT: {Name}_{ISO2}_{Year}
#   Name  — romanized spelling of the #1 baby name (exact, as reported)
#   ISO2  — ISO 3166-1 alpha-2 country code (uppercase)
#   Year  — 4-digit year the name held #1 position
#
# FILE SLUG FORMAT: {lowercase-key-with-hyphens}_{YYYYMMDD}
#   Example key Liam_US_2023 → slug liam-us-2023
#   Full filename: content/monkeys/liam-us-2023_20260308.md
#   Explorer display: "Liam_US_2023 20260308.txt"
#
# MILESTONE TAGS (applied to milestones list):
#   first_in_language:{lang}   — first monkey to post in this language
#   first_in_country:{iso2}    — first monkey from this country
#   goal1_complete             — closes Goal 1 (all target languages)
#   goal2_complete:{year}      — closes the year sweep for {year}
#   goal3_complete             — closes the decade sweep
#   name_repeat:{prev_key}     — same name was #1 in a prior year
#   data_gap                   — source is non-primary (estimate/proxy)
#
# GENDER VALUES: M / F / unspecified
# LANGUAGE: ISO 639-1 two-letter code where available, else ISO 639-3

monkeys: []

