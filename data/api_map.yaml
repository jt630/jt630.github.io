clusters:
- name: Sky & Earth
  icon: 🌍
  texture: time-series, geographic, event-stream
  description: The physical world instrumented — weather, climate, seismic, air quality
  apis:
  - name: Open-Meteo
    url: https://open-meteo.com/en/docs
    shape: hourly/daily forecast grids, historical climate
    auth: none
    rate_limit: 10k/day
    notes: No key needed. Best free weather API. Historical back to 1940.
    status: idea
    project_ideas:
    - 7-day orchard forecast panel on the Farming page
    - Historical frost date chart for almond bloom risk
  - name: OpenWeatherMap
    url: https://openweathermap.org/api
    shape: current conditions, 5-day/3-hour forecast
    auth: free_key
    rate_limit: 60/min
    notes: Most-used weather API. Free tier sufficient for a site widget.
    status: idea
    project_ideas:
    - Current conditions widget for the farm's zip code
    - Rain alert banner for irrigation scheduling on Farming page
  - name: NOAA Climate Data Online
    url: https://www.ncdc.noaa.gov/cdo-web/webservices/v2
    shape: historical climate records, station data, normals
    auth: free_key
    notes: Authoritative US climate archive. Good for long-run farm analysis.
    status: idea
    project_ideas:
    - Historical frost dates chart for almond bloom risk on Farming
    - Multi-decade Central Valley rainfall chart on Farming page
  - name: USGS Earthquake Hazards
    url: https://earthquake.usgs.gov/fdsnws/event/1/
    shape: real-time seismic events, GeoJSON
    auth: none
    notes: All global earthquakes, updated every minute. No key needed.
    status: idea
    project_ideas:
    - Real-time Central Valley quake ticker on Farming page
    - Seismic event map embedded in Farming page context
  - name: AirNow
    url: https://docs.airnowapi.org/
    shape: US air quality index by zip/location
    auth: free_key
    notes: EPA AQI data. Useful for farm air quality or wildfire smoke context.
    status: idea
    project_ideas:
    - Wildfire smoke AQI alert during almond harvest season
    - Air quality badge in Farming page header
  - name: OpenAQ
    url: https://docs.openaq.org/
    shape: global air quality sensor readings
    auth: none
    notes: Community sensor network, global coverage, no key for basic queries.
    status: idea
    project_ideas:
    - Farm-local air quality index in Farming sidebar
    - Global AQI comparison widget in Brain Lab
  - name: Sunrise-Sunset
    url: https://sunrise-sunset.org/api
    shape: sunrise/sunset/golden hour times by lat/lon
    auth: none
    notes: Simple, reliable. No key. Good for farm light-hour displays.
    status: idea
    project_ideas:
    - Daylight hours bar display on Farming page header
    - Golden hour countdown for farm photography planning
- name: Space
  icon: 🚀
  texture: image-stream, event-stream, time-series
  description: Orbital mechanics, deep sky imagery, near-Earth objects, and launch data
  apis:
  - name: NASA APOD
    url: https://api.nasa.gov/#apod
    shape: one astronomy photo per day with title, explanation, media URL
    auth: free_key
    rate_limit: 1k/hour
    notes: Astronomy Picture of the Day. Easy integration, gorgeous imagery.
    status: idea
    project_ideas:
    - Daily astronomy photo rotating in Art section
    - Weekly space image gallery in Art section
  - name: NASA EONET
    url: https://eonet.gsfc.nasa.gov/docs/v3
    shape: natural event feed — wildfires, storms, volcanoes, GeoJSON
    auth: none
    notes: Earth Observatory Natural Event Tracker. Good for wildfire/drought context on the farm.
    status: idea
    project_ideas:
    - Active California wildfire event feed on Farming page
    - Natural disaster map in Farming sidebar
  - name: NASA Mars Rover Photos
    url: https://api.nasa.gov/#mars-rover-photos
    shape: photos from Curiosity/Perseverance by sol date and camera
    auth: free_key
    notes: Thousands of high-res rover photos filterable by camera. Visually rich.
    status: idea
    project_ideas:
    - Mars rover photo gallery in Art section
    - Daily rover image widget in Brain Lab
  - name: NASA NEO
    url: https://api.nasa.gov/#NeoWS
    shape: near-Earth object feed by date range, orbital data
    auth: free_key
    notes: Near-Earth Object Web Service. Asteroid close approach data.
    status: idea
    project_ideas:
    - Asteroid close-approach ticker in Brain Lab
    - Near-Earth object countdown widget in Brain section
  - name: SpaceX API
    url: https://github.com/r-spacex/SpaceX-API
    shape: launches, rockets, capsules, launchpads — JSON
    auth: none
    notes: Unofficial but comprehensive SpaceX launch history. No key needed.
    status: idea
    project_ideas:
    - Upcoming launch countdown widget in Brain Lab
    - Launch history timeline in Brain or Gaming section
  - name: Open Notify (ISS)
    url: http://open-notify.org/Open-Notify-API/
    shape: current ISS position, next pass times by lat/lon
    auth: none
    notes: Tracks the International Space Station in real time. No key needed.
    status: idea
    project_ideas:
    - ISS pass times over the farm's coordinates in Farming
    - Live ISS position tracker in Brain Lab
  - name: Le Système Solaire
    url: https://api.le-systeme-solaire.net/en/
    shape: solar system bodies — mass, radius, orbital elements
    auth: none
    notes: Clean REST API for planetary data. Good for a solar system reference page.
    status: idea
    project_ideas:
    - Solar system data cards in Brain Lab experiments
    - Planet fact comparison widget in Brain section
- name: Living Things
