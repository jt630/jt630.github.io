{{ define "main" }}
<div class="page-wrap">
  <div class="page-header">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="subtitle">{{ . }}</p>{{ end }}
  </div>
  {{ with .Content }}
    <div style="margin-bottom: 2rem;">{{ . }}</div>
  {{ end }}
  <div class="post-list">
    {{ range .Pages.ByDate.Reverse }}
      {{ partial "post-card.html" . }}
    {{ end }}
  </div>
</div>
{{ end }}
