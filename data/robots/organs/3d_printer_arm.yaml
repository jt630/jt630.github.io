# Organ manifest — read by Jarvis (operator) to decide when to call this skill.
# Schema mirrors Claude Code skill cards: id, description-with-trigger, hardware
# (analog of allowed-tools), plus preconditions + composes_with for planning.

id: 3d_printer_arm
name: 3D Printer Arm
group: fabrication

description: |
  Extrudes thermoplastic filament into arbitrary 3D shapes from a sliced model.
  TRIGGER when the robot needs a small rigid object (<15x15x20cm, <2kg load)
  that isn't on hand and can be printed in under ~10 min.
  SKIP for metal parts, food-contact items, heat-resistant parts (>60C),
  or anything structurally critical.

hardware:
  slot: arm-primary
  power_w: 45
  deploy_time_ms: 1200
  consumables: [pla_filament]
  envelope_cm: [15, 15, 20]

preconditions:
  - battery_pct >= 20
  - ambient_temp_c: {min: 15, max: 35}
  - clearance_cm >= 25
  - filament_remaining_g >= 10

inputs:
  model_stl: {type: path, required: true}
  infill_pct: {type: number, default: 20, range: [5, 100]}
  color: {type: enum, values: [black, white, red], default: black}

outputs:
  object: physical
  print_time_s: number
  filament_used_g: number

composes_with:
  - heat_mold      # post-process: soften + press the extrusion into a final form
  - vacuum         # cleanup of support material and stray strands
  - lighter        # (indirect) heat source for field repairs on printed parts

safety:
  - no flammables within 30cm during 60s cooldown
  - surface must be level within 5deg

canonical_example: r2d2     # closest sci-fi analog in sci_fi_catalog.yaml
