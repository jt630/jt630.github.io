name: Auction Watch — refresh lots

on:
  workflow_dispatch:   # run manually from the Actions UI first, and check
                        # the "Fetch lots" step's log for per-platform notes
  schedule:
    - cron: "0 13 * * *"   # daily, 13:00 UTC (~6-7am Boise, before most auctions close)

permissions:
  contents: write
  actions: write   # needed to dispatch the Hugo deploy workflow

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Fetch lots
        run: python scripts/auction_finder.py

      - name: Estimate value (needs ANTHROPIC_API_KEY secret)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/auction_value.py

      - name: Commit updated lots
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/auction_lots.yaml data/.cache/auction_*.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: refresh auction lots [skip ci]"
            git push origin main
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Hugo deploy
        if: steps.commit.outputs.committed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            })
