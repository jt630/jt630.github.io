# Monkey Name Generator
#
# Names are assigned by monkey index (1-based). The name for monkey N is:
#   adjectives[(N-1) % len(adjectives)] + nouns[(N-1) % len(nouns)]
#
# With 40 adjectives × 40 nouns = 1,600 unique names before repeating.
# Assign a monkey their number in the front matter: monkey_id: 1
# The display name (e.g. "SparkleJaw") is derived from their id at build time,
# OR you can just hardcode `monkey: "SparkleJaw"` directly.
#
# Reference list — keep this as the canonical source so names stay consistent.

