name: Dinger Palooza — Weekly Draft Board

on:
  # Every Sunday at 9 AM ET (13:00 UTC during EDT) — before the draft
  # Fallback at 11 AM ET (15:00 UTC) in case GitHub drops the first run
  schedule:
    - cron: "0 13 * * 0"
    - cron: "0 15 * * 0"

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      week:
        description: "Start date of target week (YYYY-MM-DD). Leave blank to use current week."
        required: false
        default: ""

jobs:
  update-draft-board:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the updated JSON back to main
      actions: write    # needed to dispatch the deploy workflow

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scripts/dinger_palooza/requirements.txt

      - name: Run draft board pipeline
        env:
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.week }}" ]; then
            python scripts/dinger_palooza/main.py --week "${{ github.event.inputs.week }}"
          else
            python scripts/dinger_palooza/main.py
          fi

      - name: Commit updated draft board
        id: commit
        run: |
          git config user.name  "Dinger Palooza Bot"
          git config user.email "bot@almondfarm.us"

          # Compute the week the pipeline should have generated
          EXPECTED_WEEK=$(python3 -c "
          from datetime import date, timedelta
          today = date.today()
          days_since_monday = today.weekday()
          this_monday = today - timedelta(days=days_since_monday)
          monday = this_monday + timedelta(days=7) if today.weekday() == 6 else this_monday
          print(monday.isoformat())
          ")

          # Validate the pipeline actually generated that week
          ACTUAL_WEEK=$(python3 -c "
          import json
          with open('data/dinger_palooza/draft_board.json') as f:
              d = json.load(f)
          print(d['week_start'])
          ")

          if [ "$ACTUAL_WEEK" != "$EXPECTED_WEEK" ]; then
            echo "::error::Draft board week mismatch — expected $EXPECTED_WEEK, got $ACTUAL_WEEK"
            exit 1
          fi
          echo "Week validated: $ACTUAL_WEEK"

          git add data/dinger_palooza/

          # Only commit if something actually changed
          if git diff --cached --quiet; then
            # Board already shows the correct week — a second run is fine
            echo "Draft board already current for week of $ACTUAL_WEEK — skipping commit"
            echo "committed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "feat: update Dinger Palooza draft board for week of ${ACTUAL_WEEK}"
            git push origin main
            echo "Draft board pushed to main."
            echo "committed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Hugo deploy
        if: steps.commit.outputs.committed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            })
