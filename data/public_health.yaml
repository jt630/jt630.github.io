meta:
  name: "Unlikely Correlations Engine"
  description: >
    An open-source, multi-agent research platform that surfaces hidden
    correlations between health outcomes and environmental, occupational,
    and geographic factors. Integrates public datasets, scientific literature,
    and structured causal analysis to identify leads that warrant formal
    investigation.
  stack:
    language: Python
    ai_backend: "Claude API (claude-sonnet-4-20250514)"
    ui: "Streamlit"

flagship:
  title: "The Unlikely Correlations Engine"
  subtitle: "Systematic detection of hidden health-environment associations"
  motivation: >
    Epidemiological research identified elevated Parkinson's disease rates
    among populations living near golf courses. Investigation revealed the
    underlying factor was chronic pesticide exposure from course maintenance.
    Residential proximity to treated land — not the recreational facility
    itself — was the relevant variable. The association was detectable in
    existing public datasets, but required cross-referencing sources that
    are not typically analyzed together.
  vision: >
    This project applies that same cross-referencing approach systematically.
    The platform correlates health outcome data with geographic, occupational,
    environmental, and demographic variables at the US county level. When
    a statistically significant association is detected, it searches the
    published literature for supporting or contradicting evidence, evaluates
    causal plausibility, and generates structured study proposals for
    further investigation.
  phases:
    - name: "Correlation Detection"
      description: "Cross-reference health outcomes with geographic, occupational, environmental, and demographic data at the US county level. Compute statistical correlations and identify spatial clusters using geospatial autocorrelation analysis (LISA)."
      data_sources:
        - "CDC Wonder — mortality by ICD-10 code"
        - "CMS Chronic Conditions — disease prevalence by county"
        - "EPA — pesticide use, toxic release inventory, Superfund sites"
        - "USGS — land use, water quality, pesticide application"
        - "Census ACS — demographic and socioeconomic confounders"
        - "County Health Rankings — composite health indicators"
    - name: "Literature Mining"
      description: "Search PubMed, Semantic Scholar, and other academic databases for published evidence related to detected correlations. Synthesize findings across studies, identify contradictions, and flag evidence gaps."
      data_sources:
        - "PubMed / NCBI E-utilities"
        - "Semantic Scholar API"
        - "FDA FAERS — adverse event reports"
        - "WHO Global Health Observatory"
    - name: "Causation Analysis"
      description: "Evaluate detected associations against established causal frameworks. Assess confounders, dose-response relationships, biological plausibility, temporality, and consistency across studies."
      data_sources:
        - "Cross-study comparison and contradiction analysis"
        - "Exposure pathway modeling"
        - "Bradford Hill criteria assessment"
    - name: "Study Design"
      description: "For associations with sufficient supporting evidence, generate structured research proposals including study population, methodology, controls, outcome measures, and timeline."
      data_sources:
        - "Existing study methodologies as templates"
        - "NIH and WHO study design frameworks"
  status: active

projects:
  - id: 1
    title: "Unlikely Correlations Engine"
    status: active
    icon: "🔬"
    flagship: true
    description: >
      Multi-agent pipeline for detecting hidden associations between health
      outcomes and environmental, occupational, or geographic factors.
      Integrates 20+ public data sources, searches published literature
      for supporting evidence, evaluates causal plausibility, and generates
      structured study proposals for further investigation.
    data_sources:
      - "CDC Wonder / CMS Chronic Conditions — health outcomes by county"
      - "EPA — pesticide use, toxic releases, Superfund sites, air quality"
      - "USGS — land use, water quality, pesticide application estimates"
      - "PubMed / Semantic Scholar — academic literature"
      - "Census ACS / County Health Rankings — demographic confounders"
      - "openFDA FAERS — adverse event reports"
    first_milestone: >
      End-to-end demonstration using the Parkinson's disease / pesticide
      exposure case. Reproduce the known correlation, retrieve supporting
      literature, and generate a causation assessment.
    teaches: "Multi-agent architecture, data APIs, geospatial analysis, literature synthesis"

  - id: 2
    title: "Occupational Disease Pattern Miner"
    status: planned
    icon: "👷"
    description: >
      Analyze health outcome data by occupation to identify statistically
      unusual illness rates. Surface occupations with elevated risk for
      specific disease categories relative to population baselines.
    data_sources:
      - "NIOSH occupational health datasets"
      - "BLS occupational data"
      - "Census County Business Patterns"
    first_milestone: >
      Ranked table of occupations with the highest deviation from baseline
      rates for a user-selected disease category, with confidence intervals.
    teaches: "Statistical z-scores, pandas dataframes, Streamlit data display"

  - id: 3
    title: "FDA Adverse Event Anomaly Detector"
    status: planned
    icon: "💊"
    description: >
      Analyze FDA FAERS reports to identify unexpected co-occurrences
      between drugs and health conditions not listed in current labeling.
    data_sources:
      - "openFDA FAERS API"
    first_milestone: >
      Input a drug name, return a ranked list of reported conditions sorted
      by divergence from expected adverse event profile.
    teaches: "REST API integration, statistical anomaly detection, AI-assisted interpretation"

  - id: 4
    title: "Policy Brief Summarizer"
    status: planned
    icon: "📋"
    description: >
      Structured summarization of health policy documents, academic papers,
      and institutional reports. Extracts key findings, recommendations,
      evidence quality, and identifies gaps requiring further research.
    data_sources:
      - "User-uploaded PDFs or pasted text"
    first_milestone: >
      Single-page application accepting document text and returning a
      structured summary with cited findings and evidence assessment.
    teaches: "Claude API integration, prompt engineering, Streamlit interface design"

  - id: 5
    title: "Multi-Document Research Q&A"
    status: planned
    icon: "📚"
    description: >
      Retrieval-augmented generation system for querying across a library
      of research documents. Synthesizes answers from multiple sources
      with citations to specific documents and passages.
    data_sources:
      - "User-uploaded PDF library"
    first_milestone: >
      Upload three documents, submit a natural language query, receive a
      synthesized answer with source attribution.
    teaches: "RAG architecture, vector embeddings, document indexing"

  - id: 6
    title: "Cross-Study Contradiction Finder"
    status: planned
    icon: "⚖️"
    description: >
      Comparative analysis of multiple studies on the same health topic.
      Identifies agreements, contradictions, and methodological differences.
      Assesses weight of evidence accounting for study design, population,
      and potential sources of bias.
    data_sources:
      - "User-uploaded PDFs or PubMed IDs"
    first_milestone: >
      Input two paper abstracts, receive structured comparison of findings,
      methodology, and identified discrepancies.
    teaches: "Structured prompting, comparative analysis, evidence synthesis"

  - id: 7
    title: "Health System Scorecard Dashboard"
    status: planned
    icon: "📊"
    description: >
      Comparative visualization of health system indicators across countries.
      Covers UHC service coverage index, health expenditure, out-of-pocket
      costs, workforce density, and related metrics.
    data_sources:
      - "WHO Global Health Observatory API"
      - "World Bank Health Nutrition and Population API"
    first_milestone: >
      Select countries and indicators, generate side-by-side comparison
      dashboard with trend lines.
    teaches: "Data API integration, interactive charting, dashboard layout"

  - id: 8
    title: "Global Health Funding Tracker"
    status: planned
    icon: "💰"
    description: >
      Analysis of global health funding flows from major donors. Identifies
      trends, gaps, and alignment opportunities across disease areas and
      geographic regions.
    data_sources:
      - "IATI (International Aid Transparency Initiative) open data"
      - "Gates Foundation grant database"
    first_milestone: >
      Filter grants by disease area and year, generate funding trend
      analysis with identified gaps.
    teaches: "Data filtering, AI-assisted synthesis, export functionality"

  - id: 9
    title: "Stakeholder Interview Synthesizer"
    status: planned
    icon: "🎙️"
    description: >
      Automated extraction of themes, key findings, notable statements,
      and action items from interview transcripts and stakeholder
      consultation records.
    data_sources:
      - "User-uploaded .txt or .docx transcripts"
    first_milestone: >
      Process a single transcript, extract structured themes and action
      items with source attribution.
    teaches: "File handling, structured extraction, JSON output formatting"

  - id: 10
    title: "Health Policy Diffusion Tracker"
    status: planned
    icon: "🌍"
    description: >
      Analysis of how specific health policies propagate across countries
      over time. Identifies contextual factors — economic, political,
      demographic — that correlate with adoption timing.
    data_sources:
      - "WHO policy databases"
      - "Academic literature via OpenAlex API"
      - "World Bank governance indicators"
    first_milestone: >
      Map the adoption timeline of a specific policy globally and generate
      a hypothesis about factors correlated with early adoption.
    teaches: "Timeline visualization, multi-source data joins, hypothesis generation"

learning_path:
  - week: 1
    focus: "Claude API fundamentals and Streamlit"
    projects: [4, 5]
  - week: 2
    focus: "Public data API integration"
    projects: [7, 8]
  - week: 3
    focus: "Statistical correlation and geospatial analysis"
    projects: [1, 2]
  - week: 4
    focus: "Advanced retrieval, multi-source synthesis"
    projects: [3, 6, 9, 10]
