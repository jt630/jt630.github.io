id: arm_retrieve_dropped
name: Retrieve Dropped Item (cautious floor approach)
region: arm
group: manipulation
kind: composed

description: |
  Specialized retrieval for an item that has just fallen to the floor near a
  seated or standing resident. The approach is deliberately unhurried — an
  older adult may already be leaning down to pick it up themselves, and a
  fast-moving robot at ankle level is exactly the wrong thing to introduce.
  TRIGGER when the sensor array or the resident reports a small item on the
  floor within the room: dropped pills, a pen, keys, a hearing aid, a
  medication cup.
  Elderly-care example: a resident tips their pill cup and two tablets roll
  onto the rug. Goddard approaches at the slow "fall approach" pace so as
  not to startle, verbally notes what it's doing ("I see the pills — I'll
  pick them up for you"), uses the pincer for the tablets and the paw for
  the cup, and hands both back with a steady voice.
  SKIP if the item is near a person who has themselves fallen — that's a
  fall-response scenario, not a retrieval one, and goes through the fall
  response pathway. SKIP for sharp items (broken glass), liquids, or any
  item flagged by the safety monitor as a floor hazard.

composes:
  - skill: skin_sensor_array
    role: locate_item_on_floor
  - skill: leg_walk
    role: cautious_approach
    with: {speed_preset: slow_approach}
  - skill: arm_manipulator
    role: lower_to_floor_reach
    with: {motion_profile: gentle}
  - skill: hand_pincer
    role: pick_small_rigid_item
    with: {grip_force_n: 8}
  - skill: hand_paw_grip
    role: pick_soft_or_container_item
    with: {motion_profile: gentle, grip_force_n: 4}
  - skill: leg_walk
    role: return_to_resident
    with: {speed_preset: cautious}
  - skill: skin_speaker
    role: narrate_and_handoff
    with:
      utterance_ref: narrate_and_handoff
      priority: normal
      volume_pct: 60

preconditions:
  - battery_pct >= 15
  - obstacle_clear: true
  - voice_interruptible: true
  - floor_hazard_flag: false         # no spills, no broken glass, no liquids
  - path_clear_to_item: true
  - "fall_approach_speed_cms: 8"     # reuse leg_walk's cautious cap — do not exceed
  - "speed_cap_cms: 15 when human_within_cm <= 120"
  - item_on_floor_confirmed: true    # sensor or resident report
  - item_is_not_in_resident_hand: true

voice_lines:
  # Register target: low voice, floor level, not hovering. Autonomy-first
  # framing — the "resident_reaching" line ASKS, it does not announce.
  # The medication-count line is written to flag uncertainty WITHOUT
  # alarming; "please double-check" is the key phrase caregivers should
  # preserve when tuning.
  narrate_and_handoff:           "Here you go. I have it all for you."
  resident_reaching:             "I see you're getting it — would you
                                  like me to pick it up, or would you
                                  rather do it yourself?"
  floor_hazard:                  "There's something on the floor I
                                  shouldn't touch safely. I'll let your
                                  caregiver know and stay nearby."
  grasp_failed_floor:            "I couldn't get a good hold on that one.
                                  I'll leave it where it is and let
                                  someone know."
  medication_count_uncertain:    "I picked up what I could see. Please
                                  double-check the count before you take
                                  them — I'll note this for your caregiver."

fallback:
  - trigger: resident_reaching_for_item == true
    recovery:
      # Autonomy first: if the resident is already bending toward the item,
      # stop the cautious approach at a respectful distance and ask before
      # taking over. The abort terminates the current retrieval; whatever
      # answer the resident gives comes through the intent queue on the
      # next turn.
      - skill: skin_speaker
        role: offer_handoff
        with:
          utterance_ref: resident_reaching
          priority: normal
      - abort: true
  - trigger: floor_hazard_flag == true
    recovery:
      # Sharp item, spill, broken glass — Goddard does not attempt to pick
      # it up. Voice commits to "stay nearby," so hold in place until the
      # caregiver arrives. Robot-self hold — no resident-facing restriction.
      - skill: skin_speaker
        role: announce_floor_hazard
        with:
          utterance_ref: floor_hazard
          priority: alert
      - enqueue:
          intent: caregiver_alert_floor_hazard
          source: sensor
          priority_hint: elevated
      - hold: station_nearby_safe_pose
        until: caregiver_arrival
  - trigger: grasp_attempt_count >= 2 AND grasp_success == false
    recovery:
      # Lift the arm clear of the floor to a safe neutral pose — never
      # leave the end-effector abandoned at a floor-level reach. The
      # utterance commits to alerting someone, so enqueue the alert.
      - skill: arm_manipulator
        role: lift_clear_of_floor
        with:
          motion_profile: gentle
      - skill: skin_speaker
        role: announce_grasp_failed
        with:
          utterance_ref: grasp_failed_floor
          priority: normal
      - enqueue:
          intent: caregiver_alert_floor_grasp_failed
          source: sensor
          priority_hint: normal
      - abort: true
  - trigger: item_is_medication == true AND visible_count < expected_count
    recovery:
      # Medication count flag: hand over what was recovered, speak the
      # uncertainty to the resident, and enqueue a caregiver alert so the
      # miscount reaches a human who can reconcile it — "I'll note this
      # for your caregiver" is a commitment the recovery list makes good on.
      - skill: skin_speaker
        role: announce_count_uncertain
        with:
          utterance_ref: medication_count_uncertain
          priority: alert
      - enqueue:
          intent: caregiver_alert_medication_count
          source: sensor
          priority_hint: elevated
      - abort: true

composes_with:
  - arm_fetch_object
  - arm_hand_from_shelf

safety:
  - voice_interruptible: true
  - approach speed never exceeds leg_walk's fall_approach_speed_cms (8 cm/s) in this mode
  - pincer is the default for small rigid items; paw grip whenever contact with a person's hand is likely at handoff
  - handoff is always at a full stop with the arm at resident reach height — never drop items into a lap
  - medication items flagged to caregiver log automatically for count verification

owned_by: jarvis
canonical_example: baymax         # patient, low, quiet — a healthcare companion at floor level
