  year_led: true
  label: "Commuter Car (for sister)"
  keywords:
    - "chevrolet impala"
    - "ford taurus"
    - "toyota avalon"
    - "dodge charger"
    - "chrysler 300"
    - "crown victoria"
    - "grand marquis"
    - "lincoln town car"
    - "buick lacrosse"
    - "buick lucerne"
    - "buick lesabre"
    - "buick park avenue"
    - "hyundai azera"
    - "hyundai genesis"
    - "nissan maxima"
    - "toyota camry"
    - "honda accord"
    - "ford fusion"
    - "nissan altima"
    - "chevrolet malibu"
    - "hyundai sonata"
    - "kia optima"
    - "kia cadenza"
    - "subaru legacy"
    - "subaru outback"
    - "volkswagen passat"
    - "ford edge"
    - "nissan murano"
    - "toyota venza"
    - "hyundai santa fe"
    - "kia sorento"
    - "mazda 6"
    - "mazda6"
