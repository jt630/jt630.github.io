    - title: "2022 Forester Limited"
      price: 23100
      miles: 15361
      dealer: "AutoSavvy, Boise"
      deal: "Great Deal"
      market: null
      flag: branded
      url: "https://www.cars.com/vehicledetail/9edb1ad1-6aa8-424b-b752-c7750e429bb7/"
      verdict: "Newest + lowest miles for the money — but the 'Great Deal' badge is misleading here."
      watch: "AutoSavvy sells rebuilt / branded-title cars as its business model. Cars.com rates it against clean-title prices, so a branded car always looks like a 'deal'. Expect a ~30% resale hit, higher/refused insurance, and prior collision damage. Only if you're deliberately buying a rebuilt title to save cash."

