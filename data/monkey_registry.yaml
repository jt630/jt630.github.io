# Monkey Registry
#
# One entry per language. Each monkey is an agent that performs brownian walks
# through its language's full dictionary.
#
# MONKEY IDENTITY: ISO 639-1 language code (e.g. "en", "ar", "ja")
# COIN KEY FORMAT: {lang}_{YYYYMMDD}  (e.g. "en_20260310")
# FILE PATH:       content/monkeys/{lang}_{YYYYMMDD}.md
#
# MILESTONE TAGS:
#   first_in_language:{lang}   — first coin ever minted in this language
#   goal0_complete             — closes Goal 0 (English Hamlet baseline)
#   goal1_complete             — closes Goal 1 (all target languages have ≥1 coin)
#   hamlet_fragment            — this coin contains a Hamlet n-gram match
#   hamlet_complete:{lang}     — this language has fully assembled Hamlet
#
# LANGUAGE: ISO 639-1 two-letter code where available, else ISO 639-3

monkeys: []

# ─── TEMPLATE ────────────────────────────────────────────────────────────────
# - language: "en"
#   language_name: "English"
#   monkey_name: "Liam"               # most popular baby name in primary country
#   monkey_name_native: "Liam"        # name in native script
#   name_source: "SSA"                # where the name data comes from
#   name_year: 2026                   # year the name was sourced
#   country: "US"                     # primary country (ISO 3166-1 alpha-2)
#   script: "Latin"
#   dictionary_source: "aspell-en"    # where the word list comes from
#   dictionary_size: 50000            # number of words in the dictionary
#   total_coins: 0                    # how many transmissions minted
#   first_coin_date: null             # date of first mint
#   hamlet_progress: 0.0              # percentage of Hamlet fragments found (0.0–100.0)
#   milestones: []
