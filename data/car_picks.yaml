      url: "https://www.cars.com/vehicledetail/1b763353-50fa-4910-90d2-7e161f4a4293/"
      verdict: "Best overall, and the numbers now back it: Cars.com rates it a Great Deal at ~$1,900 under market. CarMax guarantees a clean title and a return window; Touring is the loaded trim (leather, pano roof, nav). Good-era CVT."
      watch: "CarMax prices are firm — no negotiating. Factor their extended-warranty cost separately if you want it."
    - title: "2019 Forester Sport"
      price: 24870
      miles: 50566
      dealer: "Larry H. Miller Subaru, Boise"
      deal: "Good Deal"
      market: null
      url: "https://www.cars.com/vehicledetail/c527cb19-33cd-48b6-83e3-e8096d3b2f5c/"
      verdict: "Franchise Subaru dealer = clean history and CPO options. Sport trim adds dual-mode X-Mode and better wheels. Same money and miles as the Touring — pick on which dealer / trim she prefers."
      watch: "Ask about remaining powertrain warranty (5yr/60k from 2019 = likely just expired) and whether they'll certify it."
    - title: "2019 Forester Limited"
      price: 19598
      miles: 85892
      dealer: "Dillon GMC & Fiat, Boise"
      deal: "Good Deal"
      market: "$401 below market"
      url: "https://www.cars.com/vehicledetail/7bb3e878-ceeb-4234-a623-606cc8a410e1/"
