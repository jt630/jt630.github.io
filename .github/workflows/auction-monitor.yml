name: Auction Watch — refresh lots

on:
  workflow_dispatch:   # run manually from the Actions UI first, and check
                        # the "Fetch lots" step's log for per-platform notes
    inputs:
      debug_html:
        description: "Upload each fetched page's raw HTML as a build artifact (for writing/fixing a platform parser against real markup)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 13 * * *"   # daily, 13:00 UTC (~6-7am Boise, before most auctions close)

permissions:
  contents: write
  actions: write   # needed to dispatch the Hugo deploy workflow

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml playwright

      - name: Install Playwright's Chromium
        # Needed for scripts/musick_render.py: bid.musickauction.com's
        # per-item lot pages are a JS-rendered app (confirmed - a plain
        # GET there returns HTTP 202 with an empty body), so getting real
        # bid data means loading them in an actual browser, not just
        # fetching the URL. --with-deps also installs the OS libraries
        # Chromium needs that a bare ubuntu-latest runner won't have.
        run: playwright install --with-deps chromium

      - name: Fetch lots
        run: |
          if [ "${{ github.event.inputs.debug_html }}" = "true" ]; then
            python scripts/auction_finder.py --save-html debug_html
          else
            python scripts/auction_finder.py
          fi

      - name: Upload raw HTML (debug)
        if: github.event.inputs.debug_html == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: auction-debug-html
          path: debug_html/
          retention-days: 3

      - name: Push raw HTML to debug branch
        # Belt-and-suspenders alongside the artifact upload above: the
        # artifact download URL points at Azure blob storage, which isn't
        # reachable from the dev sandbox this repo's tooling gets built in
        # (same network policy that blocks the 5 auction sites + ebay.com
        # directly) - but plain `git` to github.com clearly *is* reachable,
        # so pushing the dump to its own branch is the actual way to get
        # real markup back into that session for writing parsers.
        if: github.event.inputs.debug_html == 'true'
        run: |
          if [ -d debug_html ] && [ -n "$(ls -A debug_html 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B debug/auction-html
            git add -f debug_html/
            git commit -m "debug: raw HTML dump from auction sites + eBay [skip ci]"
            git push -f origin debug/auction-html
            git checkout main
          else
            echo "no debug_html files to push"
          fi

      - name: Estimate value (needs ANTHROPIC_API_KEY secret)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/auction_value.py

      - name: Commit updated lots
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/auction_lots.yaml
          shopt -s nullglob
          cache_files=(data/.cache/auction_*.json)
          if [ ${#cache_files[@]} -gt 0 ]; then
            git add "${cache_files[@]}"
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: refresh auction lots [skip ci]"
            git push origin main
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Hugo deploy
        if: steps.commit.outputs.committed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            })
