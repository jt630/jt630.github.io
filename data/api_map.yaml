    project_ideas:
    - Macro breakdown panel auto-added to Cooking recipes
    - Nutrition label for farm-grown produce in Cooking
  - name: TheDogAPI
    url: https://thedogapi.com/
    shape: dog breed info, temperament, images
    auth: free_key
    notes: Comprehensive breed database with photos. Fun for a pets or body page.
    status: idea
    project_ideas:
    - Dog breed of the week card in Body section
    - Random dog photo widget in Brain Lab experiments
  - name: TheCatAPI
    url: https://thecatapi.com/
    shape: cat breed info, temperament, random cat images
    auth: free_key
    notes: Same pattern as TheDogAPI. Easy to integrate alongside it.
    status: idea
    project_ideas:
    - Random cat image widget in Brain Lab
    - Cat breed explorer in Body section
  - name: PokeAPI
    url: https://pokeapi.co/
    shape: Pokémon species, moves, abilities, stats — full game data
    auth: none
    rate_limit: 100/min
    notes: Complete Pokémon game data. No key. Good for gaming section.
    status: idea
    project_ideas:
    - Pokédex lookup tool in Gaming section
    - Daily Pokémon card in Gaming section
