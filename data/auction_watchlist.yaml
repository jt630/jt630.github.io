# Added 2026-11-19: manual Mustangs, 2005 and newer OR 1985 and older (skips
# the 1986-2004 Fox/SN95 years). year_ranges is checked on the title's year;
# transmission: manual is checked after the detail render. Tested: bare
# "mustang" hit repair manuals, die-cast and a Funko lot - year_led +
# excludes remove them. History has ~7 real Mustangs, so expect few.
- id: mustang_manual
  rare: true   # low-volume at Musick: gets the 🎯 Rare finds block + a GitHub issue alert
  vehicles_only: true
  year_led: true
  label: "Manual Mustang"
  transmission: manual
  year_ranges: [[2005, 2100], [1900, 1985]]
  keywords:
    - "mustang"
  exclude:
    - "repair manual"
    - "haynes"
    - "chilton"
    - "diecast"
    - "die-cast"
    - "model"
    - "hood"
    - "ornament"
    - "taillights"
    - "scoops"

# Added 2026-11-19: any car/truck 1989 or older (project/classic, manual or
# not - manual ones "may need work"). Owner's ceiling is $10k: NOT a filter,
# it lives in data/search_profiles/. year_ranges implies a leading-year title,
# which drops coin sets ("1989 U.S. Mint Proof Set") only partly - vehicles_only
# handles the rest. Tested: 34 matches, nearly all real old vehicles.
- id: classic_projects
  vehicles_only: true
  label: "Classic Project (<=10k)"
  year_ranges: [[1900, 1989]]
  exclude:
    - "repair"
    - "haynes"
    - "chilton"
    - "manual"
    - "diecast"
    - "die-cast"
    - "model"
    - "cards"
    - "card"
    - "box"
    - "wax"
    - "topps"
    - "fleer"
    - "sticker"
    - "stickers"
    - "service manual"

# Added 2026-11-19: Japanese-made dirt bikes (Honda/Yamaha/Suzuki/Kawasaki).
# Make-qualified model regex so "XR-75" bicycles and DeWalt "XR" drills don't
# match. History has only ~3 real ones (2025 KX250, 2004 TTR90, PW50) - rare
# here. Helmets/gear are excluded; the broad 'motorcycles' group is unchanged.
- id: dirt_bikes_jp
  rare: true   # low-volume at Musick: gets the 🎯 Rare finds block + a GitHub issue alert
  label: "Japanese Dirt Bike"
  keywords:
    - "dirt bike"
    - "trail bike"
    - "motocross bike"
    - "enduro bike"
    - "pit bike"
  regex:
    - '\b(honda|yamaha|suzuki|kawasaki)\s+(crf|xr|yz|wr|ttr|tt-r|klx|kx|kdx|drz|dr-z|rmz|rm-z|rm|xt|tw|dt|pw|ct|cr)\s?-?\d{2,3}\b'
  exclude:
    - "helmet"
    - "helmets"
    - "gear"
    - "goggles"
    - "boots"
    - "jersey"
    - "parts"
    - "accessories"
    - "handlebar"
    - "fender"
    - "razor"
    - "electric"
    - "kidz"
    - "bmx"
    - "bicycle"
    - "mongoose"
    - "dewalt"
    - "jacket"
    - "tire"

