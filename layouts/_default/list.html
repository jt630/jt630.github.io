{{ define "main" }}
<div class="page-wrap">
  <div class="page-header">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="subtitle">{{ . }}</p>{{ end }}
  </div>
  {{ with .Content }}
    <div style="margin-bottom: 2rem;">{{ . }}</div>
  {{ end }}
  {{ if .Pages }}
    <div class="post-list">
      {{ range .Pages.ByDate.Reverse }}
        {{ partial "post-card.html" . }}
      {{ end }}
    </div>
  {{ else }}
    <div class="empty-section">
      <p>No posts yet.</p>
    </div>
  {{ end }}
</div>
{{ end }}
