id: lighter
name: Flick-Out Lighter
group: gadgets

description: |
  Deploys a small controlled flame from a flush chassis panel.
  TRIGGER when a task needs localized heat under ~800C: igniting, heat-shrink,
  softening thermoplastic, sealing rope ends, emergency signal.
  SKIP in oxygen-enriched environments, near flammable vapors, or when a
  precision heat source is needed (use heat_mold instead for printed parts).

hardware:
  slot: chassis-panel-left-3
  power_w: 3
  deploy_time_ms: 400
  consumables: [butane_5ml]
  envelope_cm: [2, 2, 4]

preconditions:
  - battery_pct >= 2
  - butane_remaining_ml >= 0.2
  - no_flammable_vapor_detected: true

inputs:
  duration_s: {type: number, default: 2, range: [0.2, 30]}
  flame_height_mm: {type: number, default: 15, range: [5, 25]}

outputs:
  ignited: bool
  runtime_s: number

composes_with:
  - 3d_printer_arm     # heat source for post-print reshaping
  - heat_mold          # heat_mold is literally this + printer composed

safety:
  - no flammables within 15cm
  - auto-extinguish after 30s continuous use
  - stow before any movement skill fires

canonical_example: r2d2
