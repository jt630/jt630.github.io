id: heat_mold
name: Heat + Mold
region: arm                 # composed skill lives in the region of its lead organ
group: fabrication
kind: composed              # chains other skills instead of driving hardware directly

description: |
  Softens a freshly printed thermoplastic part with controlled heat, then
  presses or bends it into a final form the printer alone can't produce
  (smooth curves, snap-fits, joins, field repairs).
  TRIGGER after arm_3d_printer when the target geometry requires post-forming.
  SKIP for non-thermoplastics or parts that have fully cured past working temp.

composes:
  - skill: skin_lighter
    with: {duration_s: 4, flame_height_mm: 10}
  - skill: arm_3d_printer
    role: press_tool        # uses the arm's end-effector as the forming jig

preconditions:
  - last_print_within_s <= 180
  - part_material: pla
  - both skin_lighter and arm_3d_printer satisfy their own preconditions

inputs:
  target_profile: {type: enum, values: [bend, flatten, join, snap_fit]}
  hold_time_s: {type: number, default: 8}

outputs:
  formed: bool
  deformation_mm: number

safety:
  - skin_lighter auto-extinguishes before arm press to avoid flame contact
  - thermal camera must confirm surface <120C before handoff

owned_by: jarvis

notes: |
  Key argument for YAML-first, AI-operated skills: a composed skill is just
  a manifest referencing other manifests. Goddard reads this file and runs
  skin_lighter -> arm-press without any bespoke code.
