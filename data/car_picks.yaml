      miles: 57790
      dealer: "Dillon CJDR, Caldwell"
      deal: "Great Deal"
      market: "$912 below market"
      url: "https://www.cars.com/vehicledetail/b1b2fd73-dd8d-4287-b581-b02fb47f17d6/"
      verdict: "Newest + lowest-mile 4Runner in the valley, and Cars.com rates it a Great Deal under market. Latest running gear, 3+ good years left on the 5th-gen platform. If you're buying one to keep, this is it."
      watch: "SR5 is the base trim — part-time 4WD, no locking rear diff. Fine for gravel and forest roads; not a rock crawler."
    - title: "2018 4Runner Limited"
      price: 35490
      miles: 60423
      dealer: "Kendall GMC Buick, Nampa"
      deal: "Good Deal"
      market: "$1,900 below market"
      url: "https://www.cars.com/vehicledetail/f9645d6c-f04e-45e2-9281-4eac4e5b5d15/"
      verdict: "Biggest dollar discount on the board for a low-mile 4Runner. Limited trim = full-time 4WD with a locking center diff, X-REAS suspension, leather. The civilized one that still goes off-road."
      watch: "Priced like the 2022 SR5 but four years older — the discount is what makes it competitive. GMC dealer, so PPI at a Toyota specialist."
    - title: "2017 4Runner Limited"
      price: 29287
      miles: 98003
      dealer: "Ozzy's Car Company, Boise"
      deal: "Great Deal"
