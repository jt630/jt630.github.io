# Canonical schema example. Read this before authoring any other organ.
# This is a TOOL — it occupies the arm's active-tool slot.
# The arm itself is a separate organ.

id: arm_3d_printer
name: 3D Printer (arm-mounted tool)
region: arm
group: fabrication

description: |
  Extrudes thermoplastic filament into arbitrary 3D shapes from a sliced model.
  TRIGGER when the robot needs a small rigid object (<15x15x20cm, <2kg load)
  that isn't on hand and can be printed in under ~10 min.
  Elderly-care examples: replacement eyeglass arm tips, cane rubber ferrules,
  arthritis-friendly jar-opener grips, pill organizer inserts.
  SKIP for metal parts, food-contact items, heat-resistant parts (>60C),
  or anything structurally critical.

hardware:
  slot: active-tool          # occupies the arm's active slot when in use
  power_w: 45
  deploy_time_ms: 1200
  consumables: [pla_filament]
  envelope_cm: [15, 15, 20]
  storage_volume_cm3: 1800   # advisory: "garage space" consumed when tool sits idle

preconditions:
  - battery_pct >= 20
  - ambient_temp_c: {min: 15, max: 35}
  - clearance_cm >= 25
  - filament_remaining_g >= 10
  - no_human_within_cm: 40   # hot nozzle — do not operate in arm's reach

inputs:
  model_stl: {type: path, required: true}
  infill_pct: {type: number, default: 20, range: [5, 100]}
  color: {type: enum, values: [black, white, red], default: black}

outputs:
  object: physical
  print_time_s: number
  filament_used_g: number

composes_with:
  - skin_vacuum              # cleanup of support material + stray strands

safety:
  - no flammables within 30cm during 60s cooldown
  - surface must be level within 5deg
  - nozzle temp drops below 50C before any human-proximate motion
  - voice_interruptible: true  # operator can halt mid-print at any time

owned_by: jarvis             # planner subsystem (not reflex loop)
canonical_example: r2d2      # closest sci-fi analog in sci_fi_catalog.yaml
