- id: rifle_deer
  label: "Rifle (deer)"
  keywords:
    - rifle
    # Bare "308"/"30-06"/"30-30" without the leading period matched a LOT
    # NUMBER ("Lot #308: ...") in real data - a real caliber is always
    # written with the period in these listings, so requiring it here
    # eliminates that collision without losing any real match seen so far.
    - ".270"
    - ".30-06"
    - ".308"
    - ".30-30"
    - "bolt action"
    - "hunting rifle"

