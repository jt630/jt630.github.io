<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .Params.tabTitle }}{{ .Params.tabTitle }}{{ else if .IsHome }}{{ with .Site.Params.tabTitle }}{{ . }}{{ else }}{{ .Site.Title }}{{ end }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  {{ $css := resources.Get "css/main.css" }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
</head>
<body>
  {{ partial "nav.html" . }}
  <div class="marquee-ticker">
    <marquee behavior="scroll" direction="left" scrollamount="4">
      ✨ Welcome to Almond Farm ✨ &nbsp;&nbsp;&nbsp; 🌟 Updated daily! 🌟 &nbsp;&nbsp;&nbsp; ★ Sign our guestbook! ★ &nbsp;&nbsp;&nbsp; 💾 Bookmark this page! 💾 &nbsp;&nbsp;&nbsp; 🔥 Best site on the web 🔥 &nbsp;&nbsp;&nbsp; ✨ get on farming ✨ &nbsp;&nbsp;&nbsp;
    </marquee>
  </div>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <script>
    document.querySelector('.nav-toggle')?.addEventListener('click', function() {
      document.querySelector('.nav-links').classList.toggle('open');
    });
  </script>
</body>
</html>
