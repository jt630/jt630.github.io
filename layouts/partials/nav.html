<nav class="site-nav">
  <div class="nav-inner">
    <a href="/" class="nav-brand">Almond Farm</a>
    <button class="nav-toggle" aria-label="Toggle navigation">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <ul class="nav-links">
      {{ range .Site.Menus.main }}
        {{ if .HasChildren }}
          <li class="nav-group">
            <span class="nav-group-label" tabindex="0">{{ .Name }}<span class="nav-arrow">▾</span></span>
            <ul class="nav-dropdown">
              {{ range .Children }}
                <li><a href="{{ .URL }}">{{ .Name }}</a></li>
              {{ end }}
            </ul>
          </li>
        {{ else }}
          <li><a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} class="active"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      {{ end }}
    </ul>
  </div>
</nav>
