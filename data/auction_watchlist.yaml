# Jeremy's personal "dial in the search" watchlist — cross-cutting tags
# layered ON TOP OF category classification (guess_category() in
# auction_finder.py), not a replacement for it. A lot can match zero, one,
# or several of these regardless of its category: a "2017 Jeep Wrangler
# 4x4" is category=Vehicles AND watchlist=trucks_offroad; a "Glock 43 9mm"
# is category=Firearms AND watchlist=pistol_backcountry.
#
# Matched the same way guess_category() matches CATEGORY_KEYWORDS in
# auction_finder.py: word-boundary, case-insensitive, against
# title+description. Edit freely — no code change needed, just re-run
# scripts/auction_finder.py (or wait for the next scheduled run).
#
# label: shown as a chip on the site. keywords: what to match on.
# exclude (optional): terms that veto a match, for real name collisions.
# vehicles_only (optional): true = only match lots categorized as Vehicles.
# Test any change first: python scripts/watchlist_test.py (see /refine-search).
- id: trucks_offroad
  vehicles_only: true   # skip lots the categorizer did not file under Vehicles (e.g. a "Focus" floor scrubber)
  label: "Manual 4x4 Truck"
  # 2026-11-19: narrowed to 4x4/4WD *manual* trucks. transmission/drivetrain
  # come from the detail-page render, which only happens AFTER a title match,
  # so these rules pass while unknown and drop the lot once Musick says Auto
  # or 2WD (see structured_ok() in auction_finder.py). ATV/UTV/RZR moved to
  # their own group below.
  transmission: manual
  drivetrain: ["4x4", "4wd"]
  keywords:
    # "truck" alone was too generic (matched a truck TOOLBOX, not a
    # truck) - "pickup" plus specific models carry the real signal instead.
    - pickup
    - "4x4"
    - "4wd"
    - off-road
    - offroad
    - bronco
    - raptor
    - tacoma
    # bare "tundra" collided with a YETI Tundra cooler; "sierra" would
    # collide with Sierra-brand ammo (this is a gun-heavy auction site);
    # "colorado" risked matching the state, not the truck; "ram" risked
    # matching computer RAM in an electronics listing - all four narrowed
    # to the actual model phrase, confirmed against real data to still
    # catch every real listing seen so far.
    - "toyota tundra"
    - "dodge ram"
    - "ram 1500"
    - "ram 2500"
    - "ram 3500"
    - silverado
    - "gmc sierra"
    - "f-150"
    - "f-250"
    - "f-350"
    - "chevy colorado"
    - "chevrolet colorado"
    - ranger

# ATVs/UTVs used to ride on the truck group; split out 2026-11-19 so
# narrowing the trucks to manual 4x4 didn't make them vanish.
- id: atv_utv
  label: "ATV/UTV"
  keywords:
    - atv
    - utv
    - rzr
    - "side by side"
    - "side-by-side"

# Rewritten 2026-11-19: sister wants full-size sedan minimum, not a full SUV
# (crossovers a judgment call: only midsize ones - Edge, Murano, Outback,
# Santa Fe, Sorento). Make-qualified phrases ("dodge charger", not "charger")
# because bare words hit battery chargers, "Mid-Century" furniture, the Taurus
# revolver. year_led=true = title must start with a year, which drops repair
# manual sets, die-cast cars and seat-cover lots that merely name the car.
# Tested on 2,225 real vehicle-category titles: ~118 matches, all real cars
# (Accord/Camry/Fusion/Altima/Malibu/Sonata are midsize but large inside).
- id: commuter_cars
